[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-deepseek2api"
version = "2.0.0"
description = "DeepSeek Web to API Gateway & Hermes Agent Provider"
readme = "README.md"
authors = [{ name = "NoeFabris & Reedtrullz" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.24.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
hermes-deepseek = "deepseek_auth.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deepseek_auth*"]

[tool.setuptools.package-data]
"deepseek_auth" = ["wasm/*.wasm"]
